name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / scvi-tools ${{ matrix.scvi }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported scvi-tools on the oldest supported Python.
          - python: "3.10"
            scvi: "1.3.2"
          # Newest scvi-tools allowed by pyproject (>=1.4 requires Python >=3.12).
          - python: "3.12"
            scvi: "latest"
          - python: "3.13"
            scvi: "latest"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: |
          if [ "${{ matrix.scvi }}" = "latest" ]; then
            python -m pip install -e '.[tests]'
          else
            python -m pip install -e '.[tests]' "scvi-tools==${{ matrix.scvi }}"
          fi
          python -c "import scvi, sys; print('python', sys.version.split()[0], 'scvi-tools', scvi.__version__)"

      - name: Run tests
        run: python -m pytest -ra
